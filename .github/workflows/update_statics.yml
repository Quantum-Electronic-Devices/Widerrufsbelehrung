name: Update statics
on:
  workflow_dispatch:
    inputs:
      force-new-pr:
        description: "Close the existing pull request for the same release (if any) and open a new one under the current bot account"
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * *"

permissions: {}

jobs:
  update-static-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false # one failing source must not cancel the others
      matrix:
        static:
          - {repo: "Quantum-Electronic-Devices/Logos", version_file: ".logo_version"}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update statics
        uses: Quantum-Electronic-Devices/sync_assets@2890caf68c4623fc75fd6bc4c0708798c56cd8ac # v1.2.1
        with:
          repository: ${{ matrix.static.repo }}
          version_file: ${{ matrix.static.version_file }}
          remote-token: ${{ secrets.QED_LOGO_PA }}
          github-token: ${{ secrets.QED_BOT_PAT }}
          commit-user-name: qed-bot
          commit-user-id: 279461323
          force-new-pr: ${{ inputs.force-new-pr }}
