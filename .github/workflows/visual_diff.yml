name: "Run visual diff"

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  workflow_run:
    workflows: [ "Build PDFs" ]
    types: [ completed ]

permissions:
  contents: read
  actions: read   # needed to download artifacts from the triggering run

jobs:
  visual_diff:
    # Only run the deployment if the build workflow succeeded and we are not publishing, because this will not create an artifact
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Running in response to ${{ github.event.workflow_run.event }} event
        env:
          EVENT_CONTEXT: ${{ toJson(github) }}
        run: echo "$EVENT_CONTEXT"

      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifact from triggered workflow
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          path: ./.visual_diff/source
          pattern: '*.pdf'
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern '*.pdf' -D ./.visual_diff/release -R ${{ github.repositoryUrl }}
        shell: bash

      - name: Display structure of downloaded files
        run: ls -R ./.visual_diff
        shell: bash

      - name: Run visual diff
        uses: Quantum-Electronic-Devices/pdf-visual-diff@4e1611f183a669639772d52b45130386dbf2096d # v1.1.0
        with:
          dpi: 100
          directory-a: ./.visual_diff/release
          directory-b: ./.visual_diff/source
          output-directory: ./.visual_diff/results

      - name: Store results on a failed diff
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff-results
          path: ".visual_diff/results/*"
          retention-days: 7
